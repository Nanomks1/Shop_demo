name: check
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax, cross-file collisions, missing files, and version sync
        run: |
          for f in v3/*.js; do echo "checking $f"; node --check "$f" || exit 1; done
          FILES=""
          for s in $(grep -o 'src="[a-z0-9]*\.js' v3/index.html | cut -d'"' -f2); do
            test -f "v3/$s" || { echo "MISSING FILE: $s"; exit 1; }
            grep -q "./$s" v3/sw.js || { echo "NOT IN SW.JS: $s"; exit 1; }
            FILES="$FILES v3/$s"
          done
          cat $FILES > /tmp/bundle.js
          node --check /tmp/bundle.js || { echo "CROSS-FILE DUPLICATE DECLARATION ERROR"; exit 1; }
          test "$(grep -o '?v=[0-9]*' v3/index.html | sort -u | wc -l)" = "1" || { echo "INDEX.HTML: not all ?v= numbers are equal"; exit 1; }
          V_HTML=$(grep -o '?v=[0-9]*' v3/index.html | head -n1 | cut -d= -f2)
          V_SW=$(grep -o "aziz-shop-v3-[0-9]*" v3/sw.js | cut -d- -f4)
          test "$V_HTML" = "$V_SW" || { echo "VERSION MISMATCH: index.html($V_HTML) != sw.js($V_SW)"; exit 1; }
          echo "all good (v=$V_HTML)"
