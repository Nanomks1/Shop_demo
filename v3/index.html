<script>
if("serviceWorker" in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js?v=62").then(r=>{
    r.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update().catch(()=>{});});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!had||document.getElementById("upd"))return;
    const b=document.createElement("div");b.id="upd";b.className="upd";
    b.innerHTML='<span>تحديث جديد جاهز — أنهِ ما تكتبه ثم اضغط</span><button type="button">تحديث الآن</button>';
    b.querySelector("button").onclick=()=>location.reload();
    document.body.appendChild(b);
  });
}
</script>
